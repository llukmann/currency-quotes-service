name: currency-quotes

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quotes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quotes}
      POSTGRES_DB: ${POSTGRES_DB:-quotes}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quotes} -d ${POSTGRES_DB:-quotes}"]
      interval: 5s
      timeout: 3s
      retries: 10

  quotes:
    build: .
    # Defaults are duplicated here so that docker compose up works from a
    # clean clone with no .env. An existing .env overrides them.
    environment:
      # Assembled from the POSTGRES_* values above so that credentials have a
      # single source. The port is the in-network one and stays 5432 even when
      # POSTGRES_PORT moves the published port on the host.
      DATABASE_URL: postgres://${POSTGRES_USER:-quotes}:${POSTGRES_PASSWORD:-quotes}@postgres:5432/${POSTGRES_DB:-quotes}?sslmode=disable
      HTTP_PORT: ${HTTP_PORT:-8080}
      HTTP_READ_TIMEOUT: ${HTTP_READ_TIMEOUT:-5s}
      HTTP_WRITE_TIMEOUT: ${HTTP_WRITE_TIMEOUT:-10s}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-10s}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PROVIDER_BASE_URL: ${PROVIDER_BASE_URL:-https://api.frankfurter.dev}
      PROVIDER_TIMEOUT: ${PROVIDER_TIMEOUT:-3s}
      PROVIDER_ATTEMPTS: ${PROVIDER_ATTEMPTS:-3}
      PROVIDER_BACKOFF: ${PROVIDER_BACKOFF:-200ms}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      WORKER_POLL_INTERVAL: ${WORKER_POLL_INTERVAL:-1s}
      WORKER_TASK_TIMEOUT: ${WORKER_TASK_TIMEOUT:-15s}
      WORKER_STUCK_TIMEOUT: ${WORKER_STUCK_TIMEOUT:-60s}
      WORKER_RECOVERY_INTERVAL: ${WORKER_RECOVERY_INTERVAL:-30s}
      WORKER_MAX_ATTEMPTS: ${WORKER_MAX_ATTEMPTS:-3}
    ports:
      - "${HTTP_PORT:-8080}:${HTTP_PORT:-8080}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${HTTP_PORT:-8080}/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
